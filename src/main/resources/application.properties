spring.application.name=SansaWeigh

# MongoDB
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27017/sansaweigh?authSource=admin

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# External Scale API
external.scale.api.base-url=http://localhost:8081
external.scale.api.retry.max-attempts=3
external.scale.api.retry.initial-delay-ms=500
external.scale.api.cache.ttl-seconds=120

# Server
server.port=8080

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
